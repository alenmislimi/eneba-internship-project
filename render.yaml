databases:
  - name: eneba-marketplace-db
    databaseName: eneba_marketplace
    user: eneba_marketplace
    plan: free
    region: frankfurt

services:
  - type: web
    name: eneba-marketplace-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: eneba-marketplace-db
          property: connectionString
      - key: FRONTEND_ORIGIN
        value: https://eneba-marketplace-web.onrender.com

  - type: web
    name: eneba-marketplace-web
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://eneba-marketplace-api.onrender.com
